<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque de français</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252323;
      --paper: #f7f0e5;
      --wine: #702b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(100%, 680px);
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      color: var(--wine);
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 500;
    }
    p {
      margin: 0 auto;
      max-width: 520px;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.7;
    }
    .note {
      margin-top: 14px;
      color: #716968;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bibliothèque de français</h1>
    <p>Un espace pour apprendre, pratiquer et approfondir le français.</p>
    <p class="note">La bibliothèque est en cours de construction.</p>
  </main>
</body>
</html>
